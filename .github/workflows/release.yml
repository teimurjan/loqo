# Package releases, driven by conventional commits on main: a commit scoped to a package
# (`feat(sdk): …`) lands in that package's release pull request; merging it tags the release and
# publishes the package. Unscoped commits release nothing. See scripts/release/.
#
# Publishing uses npm OIDC trusted publishing — no NPM_TOKEN. `bun publish` can't do the OIDC
# exchange yet (oven-sh/bun#22423), so bun packs the tarball (resolving `workspace:*` from bun.lock,
# which npm can't read) and npm uploads it. Run scripts/release/setup-npm-oidc.ts once to register
# the trusted publisher for each package before the first release.
name: release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - id: release
        run: bun scripts/release/main.ts
        env:
          # Pull requests opened with GITHUB_TOKEN trigger no workflows; set RELEASE_PLEASE_TOKEN
          # (a PAT or app token) to get CI on release pull requests.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.paths_released != '[]'
    runs-on: ubuntu-latest
    # Must match the environment on each package's npm trusted publisher (scripts/release/setup-npm-oidc.ts).
    environment: npm
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm exchanges for a short-lived publish token
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.release-please.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0 # OIDC floor; no registry-url — it writes a dummy token npm prefers over OIDC
      - run: npm install --global npm@11 # 11.5.1+ is the floor for OIDC
      - run: bun install --frozen-lockfile
      # Every package, in dependency order: a package's declarations resolve @loqo/sdk from its dist.
      - run: bun run build:packages
      - name: Pack and publish
        working-directory: ${{ matrix.path }}
        run: |
          tarball="$(bun pm pack --quiet --destination "$RUNNER_TEMP")"
          npm publish "$RUNNER_TEMP/$(basename "$tarball")" --access public
