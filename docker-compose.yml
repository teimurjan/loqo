services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: opendeepl
      POSTGRES_PASSWORD: opendeepl
      POSTGRES_DB: opendeepl
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendeepl"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://opendeepl:opendeepl@postgres:5432/opendeepl
      PORT: 3000
      NODE_ENV: production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRANSLATE_BATCH_SIZE: ${TRANSLATE_BATCH_SIZE:-20}
      TRANSLATE_CONCURRENCY: ${TRANSLATE_CONCURRENCY:-2}
      TRANSLATE_MAX_RETRIES: ${TRANSLATE_MAX_RETRIES:-5}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  postgres-data:
